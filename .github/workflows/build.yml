# Builds the Windows and Mac apps on GitHub's machines and publishes them together
# as the latest release, which the download page links to. Runs on every push to
# main and on demand (Actions tab -> Build -> Run workflow).
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:

permissions:
  contents: write

env:
  WHISPER_MODELS: base.en tiny.en   # ship inside the app; tiny.en is the slow-computer fallback

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r live/requirements.txt pyinstaller
      - name: Check the confirmed-meeting rule
        run: python tests/test_gcal.py
      - name: Download the speech model
        shell: bash
        run: ./.github/get-model.sh
      - name: Add the Google sign-in client (calendar, read-only)
        shell: bash
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: if [ -z "$GOOGLE_CLIENT_JSON" ]; then echo "::error::GOOGLE_CLIENT_JSON secret is missing - without it the app cannot sign in to Google Calendar, so it cannot start"; exit 1; fi; printf '%s' "$GOOGLE_CLIENT_JSON" > live/bundle/google_client.json
      - name: Build the app
        run: >
          pyinstaller --noconfirm --windowed --name "PBD Call Copilot"
          --paths . --paths live
          --add-data "live/ui;ui"
          --add-data "live/bundle;."
          --collect-all google_auth_oauthlib
          --add-data "models;models"
          --collect-all faster_whisper --collect-all ctranslate2
          --collect-all webview --collect-all soundcard
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32
          live/app.py
      - name: Make the installer (Setup.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DAppVersion=1.0.${{ github.run_number }} installer\windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: installer/PBD-Call-Copilot-Setup.exe
          retention-days: 3

  selftest-windows:
    # Installs the real Setup.exe on a clean Windows machine and plays a test call
    # through the installed app. The release is blocked unless every check passes.
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
      - name: Install like a user would (no admin)
        shell: pwsh
        run: |
          Start-Process -FilePath .\PBD-Call-Copilot-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\PBD Call Copilot\PBD Call Copilot.exe")) { throw "not installed" }
      - name: Play the test call through the installed app
        shell: pwsh
        env:
          PBD_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          $appArgs = @('--test-wav', "`"$pwd\tests\selftest.wav`"", '--self-test', "`"$pwd\report.json`"")
          if ($env:PBD_KEY) { "ANTHROPIC_API_KEY=$env:PBD_KEY" | Out-File -Encoding ascii "$env:USERPROFILE\.pbd.env" }
          else { $appArgs += '--no-claude'; Write-Host "No key secret: testing audio and speech-to-text only" }
          $p = Start-Process -FilePath "$env:LOCALAPPDATA\Programs\PBD Call Copilot\PBD Call Copilot.exe" -ArgumentList $appArgs -PassThru
          if (-not $p.WaitForExit(1200000)) { $p.Kill(); throw "app did not finish the test call" }
      - name: Check the results
        run: python tests/check_selftest.py report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-windows-report
          path: report.json
          retention-days: 14

  mac:
    strategy:
      fail-fast: false   # always see both Mac results
      matrix:
        include:
          - runner: macos-15          # Apple Silicon (M1 and newer)
            arch: arm64
            zip: PBD-Call-Copilot-Mac-AppleSilicon.zip
          - runner: macos-15-intel    # Intel Macs
            arch: x86_64
            zip: PBD-Call-Copilot-Mac-Intel.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r live/requirements.txt pyinstaller
      - name: Check the confirmed-meeting rule
        run: python tests/test_gcal.py
      - name: Download the speech model
        run: ./.github/get-model.sh
      - name: Add the Google sign-in client (calendar, read-only)
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: if [ -z "$GOOGLE_CLIENT_JSON" ]; then echo "::error::GOOGLE_CLIENT_JSON secret is missing - without it the app cannot sign in to Google Calendar, so it cannot start"; exit 1; fi; printf '%s' "$GOOGLE_CLIENT_JSON" > live/bundle/google_client.json
      - name: Build the system-audio helper (ScreenCaptureKit)
        run: swiftc -O -target ${{ matrix.arch }}-apple-macos13.0 -o live/mac/pbd-syscap live/mac/syscap.swift
      - name: Build the app
        run: >
          pyinstaller --noconfirm --windowed --name "PBD Call Copilot"
          --osx-bundle-identifier org.pbdproject.callcopilot
          --paths . --paths live
          --add-data "live/ui:ui"
          --add-data "live/bundle:."
          --collect-all google_auth_oauthlib
          --add-data "models:models"
          --add-binary "live/mac/pbd-syscap:mac"
          --collect-all faster_whisper --collect-all ctranslate2
          --collect-all webview --collect-all soundcard
          --hidden-import pynput.keyboard._darwin --hidden-import pynput.mouse._darwin
          live/app.py
      - name: Add permission messages and sign
        run: |
          PLIST="dist/PBD Call Copilot.app/Contents/Info.plist"
          plutil -insert NSMicrophoneUsageDescription -string "PBD Call Copilot listens to your side of the call to suggest questions. Audio is never saved." "$PLIST"
          plutil -replace LSMinimumSystemVersion -string "13.0" "$PLIST"
          codesign --force --deep --sign - "dist/PBD Call Copilot.app"
      - name: Play the test call through the built app
        env:
          PBD_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=(--test-wav "$PWD/tests/selftest.wav" --self-test "$PWD/report.json")
          if [ -n "$PBD_KEY" ]; then echo "ANTHROPIC_API_KEY=$PBD_KEY" > ~/.pbd.env; else ARGS+=(--no-claude); fi
          "dist/PBD Call Copilot.app/Contents/MacOS/PBD Call Copilot" "${ARGS[@]}" > app.log 2>&1 &
          PID=$!; for i in $(seq 1 240); do kill -0 $PID 2>/dev/null || break; sleep 5; done
          kill $PID 2>/dev/null || true
          rm -f ~/.pbd.env
          python tests/check_selftest.py report.json
      - name: Show the app's own output and any macOS crash report
        if: failure()
        run: |
          echo "--- app.log"; tail -60 app.log || true
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*PBD* 2>/dev/null | head -1); do
            echo "--- $f"; head -120 "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-mac-${{ matrix.arch }}-report
          path: |
            report.json
            app.log
          retention-days: 14
      - name: Zip it
        run: ditto -c -k --keepParent "dist/PBD Call Copilot.app" "${{ matrix.zip }}"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: ${{ matrix.zip }}
          retention-days: 3

  release:
    needs: [windows, selftest-windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: PBD Call Copilot (build ${{ github.run_number }})
          make_latest: true
          files: |
            PBD-Call-Copilot-Setup.exe
            PBD-Call-Copilot-Mac-AppleSilicon.zip
            PBD-Call-Copilot-Mac-Intel.zip
