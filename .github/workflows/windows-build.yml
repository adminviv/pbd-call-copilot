# Builds the Windows app on GitHub's Windows machines and publishes the zip
# as a release, which the download page links to. Runs on every push to main
# and on demand (Actions tab -> Windows build -> Run workflow).
name: Windows build

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r live/requirements.txt pyinstaller

      - name: Download the speech model (ships inside the zip, no download on Andrew's PC)
        shell: bash
        run: |
          MODEL=small.en
          mkdir -p models/faster-whisper-$MODEL
          for f in config.json tokenizer.json vocabulary.txt model.bin; do
            curl -sfL --retry 5 "https://huggingface.co/Systran/faster-whisper-$MODEL/resolve/main/$f" \
              -o models/faster-whisper-$MODEL/$f
          done

      - name: Build the app
        run: >
          pyinstaller --noconfirm --windowed --name "PBD Call Copilot"
          --paths . --paths live
          --add-data "live/ui;ui"
          --add-data "models;models"
          --collect-all faster_whisper --collect-all ctranslate2
          --collect-all webview --collect-all soundcard
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32
          live/app.py

      - name: Zip it
        shell: pwsh
        run: Compress-Archive -Path "dist/PBD Call Copilot" -DestinationPath "PBD-Call-Copilot-Windows.zip"

      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PBD Call Copilot (build ${{ github.run_number }})
          make_latest: true
          files: PBD-Call-Copilot-Windows.zip
