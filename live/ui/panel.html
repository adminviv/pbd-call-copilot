<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PBD Call Copilot</title>
<link href="fonts.css" rel="stylesheet">
<style>
:root{--ink:#061D28;--card:#0B2A38;--card2:#0E3342;--deep:#082532;--line:#1C4453;--text:#FFFFFF;--body:#C9DCE2;--muted:#8FB0BA;--teal:#1BB1BB;--teal2:#0F8795;--star:#E8D075;--off:#3A5663;--bad:#F09A92}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font-family:Roboto,"Segoe UI",system-ui,sans-serif;font-size:15px;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
header{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.logo{height:30px;width:auto;display:block}
.brand{display:flex;flex-direction:column;padding-left:12px;border-left:1px solid var(--line)}
.brand b,.ask,.plain h2,.empty b{font-family:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",sans-serif}
.brand b{font-size:16px;letter-spacing:-.02em}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.grow{flex:1}
.toggle{height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;font-weight:600;transition:background-color .18s}
.toggle:hover{background:var(--card2)}
.track{width:38px;height:22px;background:var(--off);padding:3px;display:flex;transition:background-color .28s}
.knob{width:16px;height:16px;background:#fff;transition:transform .32s cubic-bezier(.34,1.4,.5,1)}
.on .track{background:var(--teal)} .on .knob{transform:translateX(16px)}
.sub{padding:10px 20px;display:flex;gap:18px;align-items:center;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:14px;margin-left:6px;vertical-align:middle}
.bars i{width:3px;background:var(--off);transform-origin:bottom}
.bars i{height:3px;transition:height .15s linear,background-color .2s}
.live .bars i{background:var(--teal)}
@keyframes bar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.plain{margin:16px 20px 0;padding:14px 16px;background:var(--deep);border:1px solid var(--line);animation:fade .4s ease both}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.plain p{margin:6px 0 0;font-size:15px;line-height:1.55;color:var(--body)}
.plain h2{margin:4px 0 0;font-size:17px;letter-spacing:-.01em}
main{flex:1;overflow:auto;padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);animation:cardIn .45s cubic-bezier(.2,.8,.2,1) both;overflow:hidden}
.card.newest{border-color:var(--teal);animation:cardIn .45s cubic-bezier(.2,.8,.2,1) both,glow 1.8s ease-out .5s 1}
.card.leaving{animation:cardOut .32s cubic-bezier(.4,0,.6,1) forwards}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cardOut{to{opacity:0;transform:translateX(16px);max-height:0;margin-top:-14px}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(27,177,187,.5)}100%{box-shadow:0 0 0 12px rgba(27,177,187,0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.cmain{padding:16px 16px 12px;display:flex;flex-direction:column;gap:10px}
.kind{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kind.next{color:var(--teal)}
.ask{font-size:18px;font-weight:600;line-height:1.4;letter-spacing:-.01em}
.why{font-size:14px;line-height:1.5;color:var(--body)} .why b{color:#fff}
.terms{padding:10px 16px;border-top:1px solid var(--line);background:var(--deep);display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--body)}
.terms b{color:#fff}
.paper{display:block;padding:10px 16px;background:var(--card2);color:#fff;text-decoration:none;font-size:13px;line-height:1.4;transition:background-color .18s}
.paper:hover{background:#12404F} .paper em{display:block;font-style:normal;color:var(--teal);font-size:12px;margin-top:3px}
.actions{display:flex;border-top:1px solid var(--line)}
.actions button{height:44px;border:none;background:transparent;color:var(--muted);padding:0 14px;font-size:13px;transition:background-color .18s,color .18s}
.actions button:hover{background:var(--card2);color:#fff}
.actions .starred{color:var(--star)}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:14px;line-height:1.6;max-width:36ch;animation:fade .4s ease both}
.empty b{display:block;color:#fff;font-size:20px;margin-bottom:6px}
#transcript{display:none;font-size:13px;line-height:1.55;color:var(--body)}
#transcript div{padding:4px 0;border-bottom:1px solid var(--line)} #transcript span{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.showtx #transcript{display:block} .showtx #cards{display:none}
footer{padding:10px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
footer button{border:none;background:none;color:var(--teal);font-size:12px;padding:8px 0}
.err{color:var(--bad)}
#notice{margin:12px 20px 0;padding:12px 14px;font-size:14px;line-height:1.45;border-left:4px solid var(--star);background:#2A2A1E;color:#F3E7B5;animation:fade .3s ease both}
#notice.bad{border-left-color:var(--bad);background:#3A1F22;color:#F6C9C4}
#heard{margin:10px 20px 0;font-size:13px;line-height:1.45;color:var(--muted);min-height:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#heard b{color:var(--body);font-weight:500}
#meet{margin:12px 20px 0;border:1px solid var(--line);background:var(--deep)}
#meet .mhead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
#meet .mhead b{color:var(--text);font-size:13px;font-weight:600;letter-spacing:.02em}
#meet .mhead button,#meet .signin{border:1px solid var(--line);background:var(--card);color:var(--text);font-size:13px;padding:8px 12px}
#meet .mhead button:hover,#meet .signin:hover{background:var(--card2)}
#meet .signin{background:var(--teal2);border-color:var(--teal2);font-weight:600}
#meet .signin:hover{background:#0c7480}
#meet .mbody{padding:12px 14px;font-size:13px;color:var(--body);line-height:1.5}
#meet ul{list-style:none;margin:0;padding:0;max-height:168px;overflow:auto}
#meet li{display:grid;grid-template-columns:118px 1fr auto;gap:10px;align-items:baseline;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--body)}
#meet li:last-child{border-bottom:none}
#meet li .when{color:var(--muted);font-variant-numeric:tabular-nums}
#meet li .what{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#meet li .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
#meet li .tag.ok{color:var(--teal)}
#meet li.now{background:rgba(27,177,187,.12);border-left:3px solid var(--teal);padding-left:11px}
#meet li.now .tag{color:var(--teal);font-weight:700}
#meet .group{padding:6px 14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--ink)}
#meet details summary{cursor:pointer;padding:8px 14px;font-size:12px;color:var(--muted)}
.toggle.nomeet{opacity:.55}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <img class="logo" src="pbd-logo-white.png" alt="PBD Project">
  <div class="brand"><b>Call Copilot</b></div>
  <div class="grow"></div>
  <button id="toggle" class="toggle" aria-pressed="false" title="Ctrl + Alt + P (Mac: Control + Option + P)"><span class="track"><span class="knob"></span></span><span id="state">Off</span></button>
</header>
<div class="sub" id="sub">
  <span>You<span class="bars" id="bars-Andrew"><i></i><i></i><i></i></span></span>
  <span>Them<span class="bars" id="bars-Them"><i></i><i></i><i></i></span></span>
  <span class="grow"></span><span id="clock"></span><span id="sharenote">Hidden from screen share</span>
</div>
<section id="meet" aria-label="Meetings"><div class="mbody">Loading your meetings…</div></section>
<div id="notice" role="alert" hidden></div>
<div id="heard" aria-live="polite"></div>
<div id="plainbox"></div>
<main id="main">
  <div id="cards"><div class="empty"><b>Ready</b>Off. During a confirmed meeting, press Ctrl + Alt + P or click the switch to start listening.</div></div>
  <div id="transcript"></div>
</main>
<footer><span id="saved">0 saved for follow-up</span><span id="model"></span><span id="ver"></span><button id="txbtn" type="button">Show transcript</button></footer>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let cards = [], starred = [], on = false, startedAt = null;

// macOS doesn't reliably keep windows out of whole-screen shares.
if (/Mac/.test(navigator.platform)) { $("sharenote").textContent = "Share one window, not your whole screen"; $("toggle").title = "Control + Option + P"; }
function api(){ return (window.pywebview && window.pywebview.api) || null; }
$("toggle").onclick = () => api() && api().toggle();
$("txbtn").onclick = () => { document.body.classList.toggle("showtx"); $("txbtn").textContent = document.body.classList.contains("showtx") ? "Show suggestions" : "Show transcript"; };

function setOn(v){
  on = v; $("toggle").classList.toggle("on", v); $("toggle").setAttribute("aria-pressed", String(v));
  $("state").textContent = v ? "Listening" : "Off"; $("sub").classList.toggle("live", v);
  if (v && !startedAt) startedAt = Date.now(); if (!v) startedAt = null;
}
setInterval(() => { if (!startedAt) { $("clock").textContent = ""; return; } const s = Math.floor((Date.now()-startedAt)/1000); $("clock").textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }, 1000);

function render(){
  const box = $("cards");
  if (!cards.length){ box.innerHTML = on ? '<div class="empty"><b>Listening</b>The first suggestions appear about a minute into the conversation. The bars above move when it hears you and the other side.</div>' : '<div class="empty"><b>Ready</b>Off. During a confirmed meeting, press Ctrl + Alt + P or click the switch to start listening.</div>'; return; }
  box.innerHTML = cards.map((c, i) => `
    <article class="card ${i === 0 ? "newest" : ""}" data-i="${i}">
      <div class="cmain">
        <span class="kind ${c.kind === "next_step" ? "next" : ""}">${c.kind === "next_step" ? "Next step for PBD" : "Ask"} · ${esc(c.at)}</span>
        <div class="ask">${esc(c.ask)}</div>
        <div class="why"><b>What this means for PBD:</b> ${esc(c.why)}</div>
      </div>
      ${(c.terms||[]).length ? `<div class="terms">${c.terms.map(t => `<span><b>${esc(t.term)}</b> = ${esc(t.plain)}</span>`).join("")}</div>` : ""}
      ${c.paper ? `<a class="paper" href="https://pubmed.ncbi.nlm.nih.gov/${esc(c.paper.pmid)}/" target="_blank">${esc(c.paper.title)}<em>${esc(c.paper.first_author)} et al. ${esc(c.paper.year)} · ${esc(c.paper.journal)} · PMID ${esc(c.paper.pmid)} ✓</em></a>` : ""}
      <div class="actions"><span class="grow"></span>
        <button type="button" class="${starred.includes(c.ask) ? "starred" : ""}" onclick="star(${i})">${starred.includes(c.ask) ? "★ Saved" : "☆ Save for follow-up"}</button>
        <button type="button" onclick="dismiss(${i})" aria-label="Dismiss">✕</button>
      </div>
    </article>`).join("");
}
function star(i){ const a = cards[i].ask; starred = starred.includes(a) ? starred.filter(x => x !== a) : starred.concat(a); $("saved").textContent = `${starred.length} saved for follow-up`; api() && api().star(a); render(); }
function dismiss(i){ const el = document.querySelector(`[data-i="${i}"]`); if (el) el.classList.add("leaving"); setTimeout(() => { cards.splice(i, 1); render(); }, 320); }


// -- meetings from the signed-in Google calendar ------------------------------
const fmtTime = (iso) => new Date(iso).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
const fmtDay = (iso) => { const d = new Date(iso), t = new Date(); const same = (a, b) => a.toDateString() === b.toDateString();
  const y = new Date(t); y.setDate(t.getDate() - 1); const n = new Date(t); n.setDate(t.getDate() + 1);
  return same(d, t) ? "Today" : same(d, y) ? "Yesterday" : same(d, n) ? "Tomorrow" : d.toLocaleDateString([], {weekday: "short", month: "short", day: "numeric"}); };
function meetRow(m, active){
  const tag = m.id === active ? "Now" : m.confirmed ? "Confirmed" : esc(m.why_not);
  return `<li class="${m.id === active ? "now" : ""}" title="${esc(m.calendar)}"><span class="when">${fmtDay(m.start)} ${fmtTime(m.start)}</span><span class="what">${esc(m.title)}</span><span class="tag ${m.confirmed ? "ok" : ""}">${tag}</span></li>`;
}
async function signIn(btn){
  btn.disabled = true; btn.textContent = "Finish signing in in your browser…";
  const r = api() ? await api().sign_in() : {ok: false, message: "Not available here"};
  if (!r.ok){ btn.disabled = false; btn.textContent = "Sign in with Google"; const n = $("notice"); n.textContent = r.message; n.className = "bad"; n.hidden = false; }
}
function renderMeetings(e){
  const box = $("meet");
  $("toggle").classList.toggle("nomeet", !e.active && !on);
  if (!e.configured){ box.innerHTML = `<div class="mbody">Calendar sign-in isn't set up in this version of the app.</div>`; return; }
  if (!e.account){
    box.innerHTML = `<div class="mhead"><b>MEETINGS</b></div><div class="mbody">Sign in with Google to see your meetings. The Copilot only reads your calendar, never your email, and works during confirmed meetings.<div style="margin-top:10px"><button class="signin" type="button" onclick="signIn(this)">Sign in with Google</button></div></div>`;
    return;
  }
  const now = Date.now(), items = e.items || [];
  const current = items.filter(m => m.id === e.active);
  const upcoming = items.filter(m => m.id !== e.active && new Date(m.start).getTime() > now).slice(0, 6);
  const earlier = items.filter(m => m.id !== e.active && new Date(m.start).getTime() <= now).reverse().slice(0, 15);
  let list = current.map(m => meetRow(m, e.active)).join("");
  if (upcoming.length) list += `<li class="group" style="display:block">Upcoming</li>` + upcoming.map(m => meetRow(m, e.active)).join("");
  if (!list) list = `<li style="display:block">No meetings in the next 7 days.</li>`;
  const past = earlier.length ? `<details><summary>Earlier meetings (${earlier.length})</summary><ul>${earlier.map(m => meetRow(m, e.active)).join("")}</ul></details>` : "";
  box.innerHTML = `<div class="mhead"><b>MEETINGS</b><span>${esc(e.account)}</span><span class="grow"></span><button type="button" onclick="api() && api().refresh_meetings()">Refresh</button><button type="button" onclick="api() && api().sign_out()">Sign out</button></div><ul>${list}</ul>${past}` + (e.error ? `<div class="mbody" style="color:var(--bad)">${esc(e.error)}</div>` : "");
}

window.onCopilotEvent = (e) => {
  if (e.type === "status"){
    if (e.state === "listening"){ setOn(true); if (e.model) $("model").textContent = "Transcribing with " + e.model; render(); }
    else if (e.state === "loading"){ $("state").textContent = "Starting…"; }
    else if (e.state === "off"){ setOn(false); render(); $("heard").textContent = ""; document.querySelectorAll(".bars i").forEach(b => b.style.height = "3px"); }
    else if (e.state === "skipped"){ $("model").textContent = `Skipped ${e.seconds}s of audio to keep up`; }
    else if (e.state === "saved"){ $("model").textContent = "Transcript saved on this computer"; }
  } else if (e.type === "line"){
    $("heard").innerHTML = `Last heard · <b>${esc(e.speaker === "Andrew" ? "You" : "Them")}:</b> ${esc(e.text)}`;
    const d = document.createElement("div");
    d.innerHTML = `<span>${esc(e.speaker)}</span> ${esc(e.text)}`; $("transcript").appendChild(d);
  } else if (e.type === "suggestions"){
    if (e.in_plain_words) $("plainbox").innerHTML = `<div class="plain"><span class="eyebrow">In plain words · ${esc(e.at)}</span><h2>${esc(e.topic||"")}</h2><p>${esc(e.in_plain_words)}</p></div>`;
    else if (e.topic) $("plainbox").innerHTML = `<div class="plain"><span class="eyebrow">Now discussing · ${esc(e.at)}</span><h2>${esc(e.topic)}</h2></div>`;
    const incoming = (e.cards||[]).map(c => Object.assign({at: e.at}, c));
    if (incoming.length) cards = incoming.concat(cards).slice(0, 2);   // Andrew: 2 at a time
    render();
  } else if (e.type === "error" || e.type === "warning"){
    const n = $("notice"); n.textContent = e.message; n.className = e.type === "error" ? "bad" : ""; n.hidden = false;
  } else if (e.type === "ok"){
    $("notice").hidden = true;
  } else if (e.type === "version"){
    $("ver").textContent = "Version " + e.version;
  } else if (e.type === "meetings"){
    renderMeetings(e);
  } else if (e.type === "level"){
    const bars = document.querySelectorAll(`#bars-${e.speaker} i`), h = Math.min(14, 3 + Math.round(e.level * 11));
    bars.forEach((b, i) => b.style.height = Math.max(3, h - [3, 0, 2][i]) + "px");
  }
};
</script>
</body>
</html>
